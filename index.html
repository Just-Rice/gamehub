<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameHub — 15 arcade classics</title>
<meta name="description" content="A hand-built arcade: Flappy Bird, Tetris, Snake, Minesweeper, Wordle and more. No engines, no assets, no dependencies.">
<meta name="theme-color" content="#0b0d17">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <!-- ------------------------------------------------------------- hub -->
  <div class="hub" id="hub">
    <div class="topbar">
      <h1 class="brand">Game<span class="dot">Hub</span>
        <span class="brand-sub" id="gameCount"></span>
      </h1>
      <div class="spacer"></div>
      <button class="gbtn" id="soundBtn" type="button">🔊 Sound</button>
      <button class="gbtn" id="resetBtn" type="button">Reset scores</button>
    </div>

    <p class="tagline">Fifteen classics, written from scratch in vanilla JavaScript.
      No engines, no sprites, no dependencies. Scores are saved in your browser.</p>

    <div class="filters">
      <input class="search" id="search" type="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
      <span id="chips" role="group" aria-label="Filter by category"></span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      <span>⌨️ Arrow keys / WASD in most games</span>
      <span class="sep" aria-hidden="true">·</span>
      <span><kbd>Esc</kbd> returns to the hub</span>
      <span class="sep" aria-hidden="true">·</span>
      <span>📱 Touch controls included</span>
    </div>
  </div>

  <!-- ------------------------------------------------------------ play -->
  <div class="play" id="play">
    <div class="play-bar">
      <button class="gbtn" id="backBtn" type="button">← Hub</button>
      <h2 class="play-title" id="playTitle"></h2>
      <div class="hud" id="hud"></div>
    </div>
    <div class="stage" id="stage"></div>
    <p class="controls-hint" id="hint"></p>
  </div>

</div>

<div class="sr-only" id="announcer" aria-live="polite"></div>

<script src="js/engine.js"></script>

<!-- games register themselves; order here is the order in the grid -->
<script src="js/games/flappy.js"></script>
<script src="js/games/pong.js"></script>
<script src="js/games/snake.js"></script>
<script src="js/games/tetris.js"></script>
<script src="js/games/breakout.js"></script>
<script src="js/games/invaders.js"></script>
<script src="js/games/whack.js"></script>
<script src="js/games/simon.js"></script>
<script src="js/games/g2048.js"></script>
<script src="js/games/minesweeper.js"></script>
<script src="js/games/memory.js"></script>
<script src="js/games/tictactoe.js"></script>
<script src="js/games/connect4.js"></script>
<script src="js/games/hangman.js"></script>
<script src="js/games/wordle.js"></script>

<script src="js/main.js"></script>
</body>
</html>
